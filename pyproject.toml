[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prompt-enhancer-mcp"
version = "0.12.0"
description = "MCP servers for prompt enhancement, test workflows, pipeline failure analysis, code documentation, unit-test coverage, code quality, and security scanning"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    # mcp.server.fastmcp (FastMCP) only exists on the 1.2.0 -> 1.x line. The old
    # ">=1.0.0" floor let a fresh install resolve to <1.2 (no fastmcp yet) or to
    # the 2.0.0 major (which relocated it) -> "ModuleNotFoundError: No module
    # named 'mcp.server.fastmcp'". Pin to the 1.x line that ships fastmcp.
    "mcp>=1.2.0,<2",
    "httpx>=0.27.0",
]

# Seven separate executables from one `pip install` — each selectable on its own
[project.scripts]
prompt-enhancer-mcp    = "prompt_enhancer_mcp.enhance_server:main"
test-workflow-mcp      = "prompt_enhancer_mcp.test_server:main"
pipeline-analyzer-mcp  = "prompt_enhancer_mcp.pipeline_analyzer_server:main"
code-documentation-mcp = "prompt_enhancer_mcp.code_documentation_server:main"
unit-test-mcp          = "prompt_enhancer_mcp.unit_test_server:main"
code-quality-mcp       = "prompt_enhancer_mcp.code_quality_server:main"
security-mcp           = "prompt_enhancer_mcp.security_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/prompt_enhancer_mcp"]
